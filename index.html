        // --- 3. ICON SYSTEM (custom SVG line icons) ---
        const ICON_PATHS = {

            map:      <React.Fragment><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></React.Fragment>,
            sitemap:  <React.Fragment><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v3M6 16v-1a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></React.Fragment>,
            news:     <React.Fragment><path d="M4 22a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1h3"/><rect x="6" y="2" width="16" height="20" rx="2"/><path d="M16 6h2M10 6h2M10 10h8M10 14h8M10 18h5"/></React.Fragment>,

            faq:      <React.Fragment><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></React.Fragment>,
            layout:   <React.Fragment><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></React.Fragment>,
            server:   <React.Fragment><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></React.Fragment>,
            tools:    <React.Fragment><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></React.Fragment>
        };
        function Icon({ name, className = "w-4 h-4", stroke = 2 }) {
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {ICON_PATHS[name] || ICON_PATHS.home}
                </svg>
            );
        }

        // --- 4. HOOKS & SMALL COMPONENTS ---
        function useStageSize() {
            const ref = useRef(null);
            const [w, setW] = useState(900);
            const [vh, setVh] = useState(typeof window !== 'undefined' ? window.innerHeight : 800);
            useLayoutEffect(() => {
                const el = ref.current; if (!el) return;
                const upd = () => { setW(el.clientWidth); setVh(window.innerHeight); };
                upd();
                const ro = new ResizeObserver(upd); ro.observe(el);
                window.addEventListener('resize', upd);
                return () => { ro.disconnect(); window.removeEventListener('resize', upd); };
            }, []);
            return [ref, w, vh];
        }

        function Counter({ value, suffix = '' }) {
            const [n, setN] = useState(0); const ref = useRef(null);
            useEffect(() => {
                const ob = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) {
                        let s = 0; const dur = 1400, inc = value / (dur / 16);
                        const t = setInterval(() => { s += inc; if (s >= value) { setN(value); clearInterval(t); } else setN(Math.floor(s)); }, 16);
                        ob.disconnect();
                    }
                }, { threshold: 0.5 });
                if (ref.current) ob.observe(ref.current);
                return () => ob.disconnect();
            }, [value]);
            return <span ref={ref}>{n}{suffix}</span>;
        }

        function Bar({ label, pct, cls }) {
            const [w, setW] = useState('0%'); const ref = useRef(null);
            useEffect(() => {
                const ob = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setTimeout(() => setW(pct + '%'), 120); ob.disconnect(); } }, { threshold: 0.3 });
                if (ref.current) ob.observe(ref.current);
                return () => ob.disconnect();
            }, [pct]);
            return (
                <div ref={ref} className="flex items-center gap-4 mb-3.5">
                    <span className="text-[13px] text-ink/70 min-w-[150px] md:min-w-[210px] font-medium">{label}</span>
                    <div className="flex-1 h-[6px] bg-alu-100 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full ${cls} transition-all duration-1000 ease-out`} style={{ width: w }}></div>
                    </div>
                    <span className="font-mono text-[11px] text-slate2 min-w-[34px] text-right">{pct}%</span>
                </div>
            );
        }

        function SectionHead({ kicker, title, count }) {
            return (
                <div className="flex items-end justify-between mb-8 pb-5 border-b border-hair">
                    <div>
                        {kicker && <div className="font-mono text-[10px] tracking-[0.22em] text-blue uppercase mb-2 font-bold">{kicker}</div>}
                        <h2 className="font-display text-[26px] md:text-[30px] font-bold tracking-tightest text-ink leading-none">{title}</h2>
                    </div>
                    {count && <span className="font-mono text-[11px] text-slate2 bg-white hairline px-3 py-1 rounded-full shadow-sm">{count}</span>}
                </div>
            );
        }

        function DeviceGlyph({ frame, active }) {
            const c = active ? '#0060AB' : '#64748b';
            if (frame === 'phone') return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5"><rect x="6" y="2" width="12" height="20" rx="3" /><path d="M11 18h2" /></svg>;
            if (frame === 'tablet') return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5"><rect x="4" y="2" width="16" height="20" rx="2.5" /><path d="M11 18h2" /></svg>;
            return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5"><rect x="2" y="4" width="20" height="14" rx="2" /><path d="M8 22h8M12 18v4" /></svg>;
        }

        // --- 5. LIVE VIEWPORT (device switcher + drag-scroll chips) ---
        function LiveViewport({ lang, dict }) {
            const [pageIdx, setPageIdx] = useState(0);
            const [devId, setDevId] = useState('laptop');
            const [landscape, setLandscape] = useState(false);
            const [stageRef, stageW, vh] = useStageSize();
            const chipsRef = useRef(null);
            const drag = useRef({ down: false, startX: 0, startScroll: 0, moved: false });
            const [chipEdge, setChipEdge] = useState({ l: false, r: true });
            const page = PAGES[pageIdx];
            const device = DEVICES.find(d => d.id === devId);
            const isMobileFrame = device.frame === 'phone' || device.frame === 'tablet';
            const land = landscape && isMobileFrame;
            const frameW = device.w;           // กรอบมือถือไม่เปลี่ยนรูป
            const frameH = device.h;
            const viewW = land ? device.h : device.w;  // สำหรับ readout เท่านั้น
            const viewH = land ? device.w : device.h;
            const CH = 44, PADP = 16, PADT = 20;
            let baseW, baseH, standH = 0;

            if (device.frame === 'phone') { baseW = frameW + PADP * 2; baseH = frameH + PADP * 2; }
            else if (device.frame === 'tablet') { baseW = frameW + PADT * 2; baseH = frameH + PADT * 2; }
            else { standH = device.id === 'laptop' ? 20 : 30; baseW = frameW; baseH = CH + frameH + standH; }

            const stageH = Math.max(460, Math.min(vh * 0.65, 750));
            const scale = Math.min((stageW - 32) / baseW, stageH / baseH, 1);
            const path = page.url.replace(BASE, '') || '/';

            const updateChipEdge = () => {
                const el = chipsRef.current; if (!el) return;
                setChipEdge({ l: el.scrollLeft > 4, r: el.scrollLeft + el.clientWidth < el.scrollWidth - 4 });
            };
            useEffect(() => {
                updateChipEdge();
                const t = setTimeout(updateChipEdge, 120);
                window.addEventListener('resize', updateChipEdge);
                return () => { clearTimeout(t); window.removeEventListener('resize', updateChipEdge); };
            }, [lang]);
            const scrollChips = (dir) => { const el = chipsRef.current; if (!el) return; el.scrollBy({ left: dir * 280, behavior: 'smooth' }); };

            // Drag-to-scroll (mouse / touch via pointer events)
            const onChipDown = (e) => { const el = chipsRef.current; if (!el) return; drag.current = { down: true, startX: e.clientX, startScroll: el.scrollLeft, moved: false }; };
            const onChipMove = (e) => {
                if (!drag.current.down) return;
                const dx = e.clientX - drag.current.startX;
                if (Math.abs(dx) > 4) drag.current.moved = true;
                chipsRef.current.scrollLeft = drag.current.startScroll - dx;
                updateChipEdge();
            };
            const endChipDrag = () => { drag.current.down = false; };

            const Chrome = (
                <div className="h-[44px] bg-[#f1f5f9] border-b border-hair flex items-center gap-3 px-5 shrink-0 shadow-sm relative z-10">
                    <div className="flex gap-2">
                        <span className="w-3.5 h-3.5 rounded-full bg-[#ff5f57] shadow-inner"></span>
                        <span className="w-3.5 h-3.5 rounded-full bg-[#febc2e] shadow-inner"></span>
                        <span className="w-3.5 h-3.5 rounded-full bg-[#28c840] shadow-inner"></span>
                    </div>
                    <div className="flex-1 mx-4 bg-white border border-hair rounded-lg text-[12px] text-slate2 font-mono px-4 py-1.5 truncate flex items-center gap-2.5 shadow-sm justify-center max-w-xl">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="text-alu-400 shrink-0"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                        sankyoalumithailand.com<span className="opacity-40">{decodeURIComponent(path).slice(0, 32)}</span>
                    </div>
                </div>
            );

            const Screen = (
                  <div className="w-full h-full bg-white overflow-hidden vp-loading relative">
                  {land ? (
                  <div style={{
                  position: 'absolute', width: frameH, height: frameW,
                  top: frameH, left: 0,
                  transformOrigin: 'top left', transform: 'rotate(-90deg)'
                  }}>
                  <iframe key={page.url + devId + landscape} src={page.url}
                  title={page.name[lang]} loading="lazy"
                  sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                  style={{ width: '100%', height: '100%', border: 0 }} className="animate-fade" />
                  </div>
                 ) : (
                <iframe key={page.url + devId + landscape} src={page.url}
                title={page.name[lang]} loading="lazy"
                sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                style={{ width: '100%', height: '100%', border: 0 }} className="animate-fade" />
                )}
                </div>
                );

            let frame;
            if (device.frame === 'phone') {
                frame = (
                    <div style={{ width: baseW, height: baseH }} className="relative stage-shadow rounded-[56px] transition-all duration-300">
                        <div className="absolute inset-0 rounded-[56px] bg-[#1a1c23] shadow-inner"></div>
                        <div className="absolute inset-0 rounded-[56px] ring-2 ring-white/10"></div>
                        <div className="absolute overflow-hidden rounded-[42px] bg-black" style={{ top: PADP, left: PADP, right: PADP, bottom: PADP }}>
                            {Screen}
                            <div className="absolute top-3 left-1/2 -translate-x-1/2 w-[30%] h-[28px] bg-black rounded-full z-20 shadow-md"></div>
                            <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-[35%] h-[4px] bg-black/20 rounded-full z-20"></div>
                        </div>
                    </div>
                );
            } else if (device.frame === 'tablet') {
                frame = (
                    <div style={{ width: baseW, height: baseH }} className="relative stage-shadow rounded-[36px] transition-all duration-300">
                        <div className="absolute inset-0 rounded-[36px] bg-[#1e222b]"></div>
                        <div className="absolute inset-0 rounded-[36px] ring-2 ring-white/10"></div>
                        <div className="absolute overflow-hidden rounded-[20px] bg-black" style={{ top: PADT, left: PADT, right: PADT, bottom: PADT }}>
                            {Screen}
                            <div className={`absolute w-[6px] h-[6px] bg-[#000] rounded-full z-20 ring-1 ring-white/10 ${land ? 'left-2.5 top-1/2 -translate-y-1/2' : 'top-2.5 left-1/2 -translate-x-1/2'}`}></div>
                        </div>
                    </div>
                );
            } else {
                frame = (
                    <div style={{ width: baseW, height: baseH }} className="relative transition-all duration-300">
                        <div className="absolute top-0 left-0 right-0 rounded-t-[16px] rounded-b-md overflow-hidden bg-white hairline stage-shadow flex flex-col border border-black/5" style={{ height: CH + dh }}>
                            {Chrome}
                            <div className="flex-1 overflow-hidden">{Screen}</div>
                        </div>
                        {device.id === 'laptop' ? (
                            <div className="absolute left-1/2 -translate-x-1/2 flex justify-center" style={{ top: CH + dh, width: baseW * 1.14 }}>
                                <div className="brushed rounded-b-[18px] border-x border-b border-alu-300 relative shadow-2xl flex flex-col items-center w-full" style={{ height: standH }}>
                                    <div className="absolute top-0 w-28 h-2 rounded-b-md bg-alu-300/40 shadow-inner"></div>
                                </div>
                            </div>
                        ) : null}
                    </div>
                );
            }

            return (
                <div className="animate-fade">
                    <SectionHead kicker="Live Viewport" title={dict.vp_title} count={`${PAGES.length} ${dict.page}`} />

                    {/* Page chips — drag-to-scroll + arrows + edge fades */}
                    <div className="relative -mt-2 mb-4">
                        <div className={`pointer-events-none absolute left-0 top-0 bottom-4 w-12 z-10 bg-gradient-to-r from-[#f8fafc] to-transparent transition-opacity duration-200 ${chipEdge.l ? 'opacity-100' : 'opacity-0'}`}></div>
                        <div className={`pointer-events-none absolute right-0 top-0 bottom-4 w-12 z-10 bg-gradient-to-l from-[#f8fafc] to-transparent transition-opacity duration-200 ${chipEdge.r ? 'opacity-100' : 'opacity-0'}`}></div>
                        {chipEdge.l && (
                            <button onClick={() => scrollChips(-1)} aria-label="scroll left"
                                className="absolute left-0 top-[calc(50%-8px)] -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-white hairline shadow-md flex items-center justify-center text-ink hover:bg-alu-50 hover:text-blue transition-colors">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6" /></svg>
                            </button>
                        )}
                        {chipEdge.r && (
                            <button onClick={() => scrollChips(1)} aria-label="scroll right"
                                className="absolute right-0 top-[calc(50%-8px)] -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-white hairline shadow-md flex items-center justify-center text-ink hover:bg-alu-50 hover:text-blue transition-colors">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6" /></svg>
                            </button>
                        )}
                        <div ref={chipsRef} onScroll={updateChipEdge}
                            onPointerDown={onChipDown} onPointerMove={onChipMove} onPointerUp={endChipDrag} onPointerLeave={endChipDrag}
                            className="flex gap-2.5 overflow-x-auto hide-sb pb-4 px-1 cursor-grab active:cursor-grabbing select-none">
                            {PAGES.map((p, i) => (
                                <button key={p.id} onClick={() => { if (drag.current.moved) return; setPageIdx(i); }}
                                    className={`shrink-0 flex items-center gap-2 px-4 py-2 rounded-full text-[13px] font-semibold border transition-all duration-200 ${i === pageIdx ? 'bg-ink text-white border-ink shadow-md scale-105' : 'bg-white text-ink/70 border-hair hover:border-blue hover:text-blue shadow-sm'}`}>
                                    <Icon name={p.icon} className="w-[15px] h-[15px] shrink-0" stroke={2} />{p.name[lang]}
                                    {p.isNew && <span className="text-[9px] font-bold bg-success/20 text-success px-1.5 py-0.5 rounded-md uppercase tracking-wider">NEW</span>}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Device toolbar */}
                    <div className="flex flex-wrap items-center gap-4 bg-white/80 backdrop-blur-md hairline rounded-2xl p-3 mb-8 shadow-sm">
                        <div className="flex items-center gap-1.5 bg-alu-50 rounded-xl p-1.5 overflow-x-auto hide-sb border border-hair">
                            {DEVICES.map(d => (
                                <button key={d.id} onClick={() => setDevId(d.id)}
                                    className={`shrink-0 flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-[12px] font-bold transition-all duration-200 ${d.id === devId ? 'bg-white text-blue shadow-sm hairline' : 'text-slate2 hover:text-ink hover:bg-white/60'}`}>
                                    <DeviceGlyph frame={d.frame} active={d.id === devId} />
                                    <span className="hidden sm:inline">{d.short}</span>
                                </button>
                            ))}
                        </div>
                        <button onClick={() => setLandscape(v => !v)} disabled={!isMobileFrame}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-[12px] font-bold border transition-all duration-200 ${!isMobileFrame ? 'opacity-40 cursor-not-allowed bg-white text-slate2 border-hair' : land ? 'bg-blue/10 text-blue border-blue/20' : 'bg-white text-slate2 border-hair hover:text-ink hover:bg-alu-50 shadow-sm'}`}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" /><path d="M3 21v-5h5" /></svg>
                            {dict.rotate}
                        </button>
                       <span className="font-mono text-[12px] text-ink/60 font-bold ml-auto px-4 py-2 bg-alu-50 rounded-xl hidden sm:block border border-hair shadow-inner">{viewW} × {viewH}<span className="opacity-40 ml-2">· {(scale * 100).toFixed(0)}%</span></span>
                        <a href={page.url} target="_blank" rel="noopener noreferrer"
                            className="flex items-center gap-2 bg-ink hover:bg-blue text-white text-[12.5px] font-bold px-5 py-2 rounded-xl transition-colors ml-auto sm:ml-0 shadow-md">
                            {dict.openLive}
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7" /><path d="M8 7h9v9" /></svg>
                        </a>
                    </div>

                    {/* Stage */}
                    <div ref={stageRef} className="alu-mesh grid-lines hairline rounded-[32px] px-4 py-12 flex items-center justify-center overflow-hidden relative" style={{ minHeight: stageH + 80 }}>
                        <div className="absolute inset-0 bg-gradient-to-b from-transparent to-white/60 pointer-events-none"></div>
                        <div className="relative z-10" style={{ width: baseW * scale, height: baseH * scale }}>
                            <div className="absolute top-0 left-0 origin-top-left transition-transform duration-300 ease-out" style={{ width: baseW, height: baseH, transform: `scale(${scale})` }}>
                                {frame}
                            </div>
                        </div>
                    </div>
                    <p className="text-center text-[12px] text-slate2 mt-5 font-medium">{dict.vp_hint}</p>
                </div>
            );
        }

        function SummaryTab({ lang, dict }) {
            return (
                <div className="animate-fade space-y-16 pb-6">
                    <div>
                        <SectionHead kicker="Architecture & UI" title={dict.tasksTitle} count={`${TASKS.length} ${dict.taskItems}`} />
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {TASKS.map(t => (
                                <div key={t.id} className="group bg-white hairline rounded-[24px] p-8 hover:-translate-y-1 hover:shadow-xl transition-all duration-300 flex flex-col">
                                    <div className="flex items-center justify-between mb-6">
                                        <span className="font-display text-[36px] font-bold text-alu-300 group-hover:text-blue/40 transition-colors leading-none">{t.num}</span>
                                        <div className="flex gap-1.5">{t.badges.map((b, i) => (<span key={i} className={`text-[10px] font-bold px-3 py-1.5 rounded-lg ${b.color}`}>{b.label}</span>))}</div>
                                    </div>
                                    <h3 className="font-display text-[19px] font-bold text-ink mb-2 leading-tight">{t.title[lang]}</h3>
                                    <div className="font-mono text-[11px] font-bold text-blue mb-6 bg-blue/5 border border-blue/10 inline-block px-2.5 py-1 rounded-md w-fit">{t.page}</div>
                                    <ul className="space-y-3.5 mb-8 flex-1">
                                        {t.features[lang].map((f, i) => (
                                            <li key={i} className="flex gap-3 text-[14px] text-ink/80 leading-relaxed font-medium">
                                                <span className="text-blue-light mt-1.5 w-1.5 h-1.5 rounded-full bg-blue-light shrink-0"></span>{f}
                                            </li>
                                        ))}
                                    </ul>
                                    <div className="flex flex-wrap gap-2 pt-6 border-t border-hair">
                                        {t.tags.map(tag => (<span key={tag} className="text-[11px] font-bold text-slate2 bg-alu-50 border border-hair rounded-full px-3 py-1.5">{tag}</span>))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div>
                        <SectionHead kicker="Under the hood" title={dict.stackTitle} />
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {[['frontend', 'layout', TECH_STACK.frontend], ['backend', 'server', TECH_STACK.backend], ['tooling', 'tools', TECH_STACK.tooling]].map(([k, ic, items]) => (
                                <div key={k} className="bg-white hairline rounded-[24px] p-8 hover:card-shadow transition-shadow">
                                    <div className="flex items-center gap-3 mb-6"><span className="w-11 h-11 rounded-xl bg-blue/8 border border-blue/15 flex items-center justify-center text-blue"><Icon name={ic} className="w-5 h-5" /></span><h3 className="font-display text-[16px] font-bold uppercase tracking-widest text-ink">{dict[k]}</h3></div>
                                    <div className="flex flex-wrap gap-2">{items.map(i => (<span key={i} className="text-[12px] font-bold text-ink/70 bg-alu-50 border border-hair rounded-lg px-3.5 py-1.5 shadow-sm">{i}</span>))}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="bg-white hairline rounded-[24px] p-9 shadow-sm">
                            <h3 className="font-display text-[22px] font-bold text-ink mb-8">{dict.progTitle}</h3>
                            {PROGRESS.map((p, i) => (<Bar key={i} label={p.label[lang]} pct={p.pct} cls={p.color} />))}
                        </div>
                        <div className="bg-white hairline rounded-[24px] p-9 shadow-sm">
                            <h3 className="font-display text-[22px] font-bold text-ink mb-8">{dict.timelineTitle}</h3>
                            <div className="relative pl-8 space-y-8">
                                <div className="absolute left-[9px] top-2 bottom-2 w-[2px] bg-hair"></div>
                                {TIMELINE.map((s, i) => (
                                    <div key={i} className="relative group">
                                        <div className="absolute -left-[30px] top-0.5 w-4 h-4 rounded-full bg-white border-[4px] border-blue group-hover:bg-blue transition-colors"></div>
                                        <div className="font-mono text-[10px] text-blue font-bold tracking-widest mb-1.5">STEP {s.step}</div>
                                        <div className="font-display text-[16px] font-bold text-ink mb-1.5">{s.title[lang]}</div>
                                        <div className="text-[14px] text-ink/70 leading-relaxed font-medium">{s.desc[lang]}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function SitemapTab({ lang, dict }) {
            return (
                <div className="animate-fade pb-6">
                    <SectionHead kicker="Architecture" title={dict.sitemapTitle} count={`${PAGES.length} ${dict.page}`} />
                    <div className="bg-white hairline rounded-[24px] overflow-hidden shadow-sm">
                        <div className="overflow-x-auto thin-sb">
                            <table className="w-full text-left border-collapse min-w-[750px]">
                                <thead><tr className="bg-alu-50/80 border-b border-hair">
                                    {[dict.pageCol, dict.urlCol, dict.funcCol, dict.typeCol].map(h => (<th key={h} className="px-7 py-5 text-[11px] font-bold text-slate2 uppercase tracking-widest">{h}</th>))}
                                </tr></thead>
                                <tbody className="bg-white">
                                    {PAGES.map(p => (
                                        <tr key={p.id} className="border-b border-hair last:border-0 hover:bg-alu-50/50 transition-colors">
                                            <td className="px-7 py-5 align-top"><div className="flex items-center gap-3 font-bold text-ink text-[14.5px]"><span className="w-8 h-8 rounded-lg bg-blue/8 border border-blue/12 flex items-center justify-center text-blue shrink-0"><Icon name={p.icon} className="w-[17px] h-[17px]" /></span>{p.name[lang]}{p.isNew && <span className="text-[9px] font-bold bg-success/20 text-success px-2 py-0.5 rounded-md tracking-wider">NEW</span>}</div></td>
                                            <td className="px-7 py-5 align-top"><a href={p.url} target="_blank" rel="noopener noreferrer" className="font-mono text-[11px] text-blue bg-blue/5 rounded-md px-3 py-1.5 inline-block max-w-[220px] truncate hover:bg-blue/15 transition-colors border border-blue/10 font-bold">{decodeURIComponent(p.url.replace(BASE, '') || '/').slice(0, 30)}</a></td>
                                            <td className="px-7 py-5 align-top"><div className="flex flex-wrap gap-2.5">{p.funcs[lang].map(f => (<span key={f} className="text-[12px] bg-white border border-hair text-ink/75 font-medium rounded-md px-3 py-1 shadow-sm">{f}</span>))}</div></td>
                                            <td className="px-7 py-5 align-top"><span className={`text-[11px] font-bold px-3.5 py-1.5 rounded-full border ${TYPE_COLORS[p.type]}`}>{p.type}</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function ResponsiveTab({ lang, dict }) {
            const bps = [
                { icon: 'phone', name: 'Mobile Layout', range: '320 – 767px', desc: { th: "แสดงผล 1 คอลัมน์สมบูรณ์แบบ", en: "Single-col optimized layout" }, f: ["CSS-only Hero Banner", "Full-height Menu Drawer", "Apple-style Capsule Buttons", "Bottom-safe paddings"] },
                { icon: 'tablet', name: 'iPad / Tablet', range: '768 – 1279px', desc: { th: "รองรับ 2 คอลัมน์ + Grid ยืดหยุ่น", en: "2-col + Flexible Grid" }, f: ["Premium Hamburger Menu", "Accordion Submenu", "2-col Product Grid", "Floating interactive elements"] },
                { icon: 'browser', name: 'Desktop & Widescreen', range: '≥ 1280px', desc: { th: "แสดงผลเต็มรูปแบบด้วย Whitespace", en: "Full layout with ample whitespace" }, f: ["CSS Grid 3-column", "Glassmorphism Sticky Navbar", "Full Dropdown Menu", "Multi-column Footer"] }
            ];
            return (
                <div className="animate-fade pb-6 space-y-16">
                    <div>
                        <SectionHead kicker="Every screen" title={dict.respTitle} count="3 breakpoints" />
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {bps.map((b, i) => (
                                <div key={i} className="bg-white hairline rounded-[24px] p-9 hover:shadow-xl transition-all duration-300">
                                    <div className="mb-6 bg-alu-50 w-14 h-14 rounded-2xl flex items-center justify-center border border-hair shadow-sm"><DeviceGlyph frame={b.icon} active={true} /></div>
                                    <h3 className="font-display text-[22px] font-bold text-ink mb-2">{b.name}</h3>
                                    <div className="font-mono text-[12px] text-blue bg-blue/10 inline-block px-3.5 py-1.5 rounded-md mb-5 font-bold">{b.range}</div>
                                    <p className="text-[14.5px] text-slate2 mb-7 leading-relaxed font-medium">{b.desc[lang]}</p>
                                    <ul className="space-y-4 pt-6 border-t border-hair">{b.f.map((x, j) => (<li key={j} className="flex items-center gap-3 text-[14px] text-ink/80 font-semibold"><span className="text-success"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>{x}</li>))}</ul>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div>
                        <SectionHead kicker="Deliverables" title={dict.fileTitle} count={`${FILES.length} files`} />
                        <div className="bg-white hairline rounded-[24px] overflow-hidden shadow-sm">
                            {FILES.map((f, i) => (
                                <div key={i} className={`flex flex-col sm:flex-row sm:items-center gap-4 px-8 py-6 hover:bg-alu-50/50 transition-colors ${i < FILES.length - 1 ? 'border-b border-hair' : ''}`}>
                                    <div className="font-mono text-[13px] text-blue bg-blue/5 border border-blue/10 px-4 py-2.5 rounded-lg sm:w-[280px] shrink-0 flex items-center gap-3 font-bold shadow-sm">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></svg>{f.file}
                                    </div>
                                    <div className="text-[14.5px] text-ink/80 flex-1 leading-relaxed font-medium">{f.purpose[lang]}</div>
                                    <span className="font-mono text-[11px] text-slate2 bg-white border border-hair px-3.5 py-1.5 rounded-full shrink-0 font-bold shadow-sm">{f.bp}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function CIBrandTab({ lang, dict }) {
            return (
                <div className="animate-fade pb-6 space-y-16">
                    <div>
                        <SectionHead kicker="Identity" title={dict.colorTitle} count="Primary · #0060AB" />
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                            {CI_COLORS.map((c, i) => (
                                <div key={i} className="bg-white hairline rounded-[24px] p-6 hover:shadow-xl transition-all duration-300 group">
                                    <div className={`w-full h-28 rounded-[16px] mb-5 ${c.border ? 'hairline' : ''} group-hover:scale-[1.03] transition-transform shadow-inner`} style={{ background: c.hex }}></div>
                                    <div className="font-display text-[16px] font-bold text-ink">{c.name}</div>
                                    <div className="font-mono text-[12px] text-slate2 mb-2 bg-alu-50 w-fit px-2.5 py-1 rounded-md mt-1.5 border border-hair font-bold">{c.hex}</div>
                                    <div className="text-[12.5px] text-ink/65 leading-relaxed mt-2.5 font-medium">{c.usage}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="bg-white hairline rounded-[24px] p-9 shadow-sm">
                            <h3 className="font-display text-[22px] font-bold text-ink mb-8">{dict.fontTitle}</h3>
                            <div className="space-y-5">
                                {CI_FONTS.map((f, i) => (
                                    <div key={i} className="bg-alu-50 rounded-2xl p-6 border border-hair hover:bg-white hover:shadow-md transition-all duration-300">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="text-[11px] text-slate2 font-bold uppercase tracking-widest">{f.role}</div>
                                            <div className="font-mono text-[11px] text-ink bg-white hairline px-3 py-1 rounded-md shadow-sm font-bold">{f.name}</div>
                                        </div>
                                        <div className="text-[28px] text-ink font-medium tracking-tight" style={{ fontFamily: f.ff + ',sans-serif' }}>{f.sample}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-white hairline rounded-[24px] p-9 shadow-sm">
                            <h3 className="font-display text-[22px] font-bold text-ink mb-8">{dict.idTitle}</h3>
                            <div className="space-y-5">
                                {CI_IDENTITY.map((id, i) => (
                                    <div key={i} className="bg-white border border-hair rounded-2xl px-6 py-5 hover:border-blue/40 hover:shadow-md transition-all duration-300 shadow-sm">
                                        <div className="text-[11px] text-blue font-bold uppercase tracking-widest mb-2">{id.k}</div>
                                        <div className="text-[16px] font-bold text-ink">{id.v}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function EngineeringTab({ lang, dict }) {
            const overall = Math.round(AUDIT.reduce((a, b) => a + b.score, 0) / AUDIT.length);
            return (
                <div className="animate-fade pb-6 space-y-16">
                    <div>
                        <SectionHead kicker="Quality" title={dict.auditTitle} count={`${dict.readiness}: ${overall}%`} />
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 bg-white hairline rounded-[24px] p-9 shadow-sm">
                                {AUDIT.map((a, i) => (<Bar key={i} label={a.area[lang]} pct={a.score} cls={a.score >= 95 ? 'bg-success' : a.score >= 90 ? 'bg-blue' : 'bg-gold'} />))}
                            </div>
                            <div className="rounded-[24px] p-9 text-center flex flex-col items-center justify-center text-white relative overflow-hidden stage-shadow" style={{ background: 'linear-gradient(145deg, #0a1628, #0060AB)' }}>
                                <div className="absolute inset-0 bg-white/5" style={{ backgroundImage: 'radial-gradient(circle at center, rgba(255,255,255,0.1) 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
                                <div className="relative z-10">
                                    <div className="font-mono text-[12px] tracking-[0.25em] text-blue-glow uppercase mb-5 font-bold">{dict.readiness}</div>
                                    <div className="font-display text-[84px] font-bold leading-none mb-4"><Counter value={overall} suffix="%" /></div>
                                    <div className="text-[14px] text-white/70 leading-relaxed font-medium px-4">{STATS[0].num}+ Pages · Premium Apple UI · Bilingual · Production-ready</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <SectionHead kicker="Next" title={dict.roadmapTitle} />
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {ROADMAP.map((r, i) => (
                                <div key={i} className="bg-white hairline rounded-[24px] p-7 flex gap-5 hover:shadow-lg transition-shadow">
                                    <span className="text-[11px] font-bold uppercase tracking-widest text-blue bg-blue/10 border border-blue/20 rounded-full px-4 py-2 h-fit shrink-0">{r.tag}</span>
                                    <p className="text-[14.5px] text-ink/80 leading-relaxed pt-1 font-medium">{r.text[lang]}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [lang, setLang] = useState('th');
            const [tab, setTab] = useState('viewport');
            const dict = DICT[lang];

            const TABS = [
                { id: 'viewport', label: dict.tab_viewport },
                { id: 'summary', label: dict.tab_summary },
                { id: 'sitemap', label: dict.tab_sitemap },
                { id: 'responsive', label: dict.tab_responsive },
                { id: 'ci', label: dict.tab_ci },
                { id: 'eng', label: dict.tab_eng }
            ];

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-blue/20">
                    {/* Sticky Glassmorphism Nav */}
                    <nav className="sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-hair shadow-sm saturate-150">
                        <div className="max-w-[1240px] mx-auto px-6 lg:px-10 h-20 flex items-center gap-6">
                            {/* Clickable logo → back to Live Preview (home) */}
                            <button onClick={() => setTab('viewport')} aria-label="SankyoAlumi — home"
                                className="flex items-center gap-3 shrink-0 group rounded-2xl pr-2 -ml-1 transition-colors hover:bg-alu-100/60">
                                <img src="logo.png" alt="SankyoAlumi Logo" className="w-12 h-12 object-contain drop-shadow-sm group-hover:scale-105 transition-transform" />
                                <div className="hidden md:flex flex-col leading-none text-left">
                                    <span className="font-display font-bold text-ink text-[17px] tracking-tight">SankyoAlumi</span>
                                    <span className="font-mono text-[9px] text-slate2 tracking-[0.18em] uppercase mt-1 group-hover:text-blue transition-colors">Dev Showcase</span>
                                </div>
                            </button>
                            <div className="flex-1 flex items-center gap-1.5 overflow-x-auto hide-sb px-2">
                                {TABS.map(t => (
                                    <button key={t.id} onClick={() => setTab(t.id)}
                                        className={`shrink-0 px-4 py-2.5 rounded-full text-[13.5px] font-bold transition-all duration-200 ${tab === t.id ? 'bg-ink text-white shadow-md' : 'text-ink/60 hover:text-ink hover:bg-alu-100'}`}>{t.label}</button>
                                ))}
                            </div>
                            <div className="flex items-center bg-alu-100 border border-hair rounded-full p-1.5 shrink-0 shadow-inner">
                                {['th', 'en'].map(l => (
                                    <button key={l} onClick={() => setLang(l)}
                                        className={`px-3.5 py-1.5 rounded-full text-[11px] font-bold transition-all duration-200 uppercase tracking-wider ${lang === l ? 'bg-white text-blue shadow-sm' : 'text-slate2 hover:text-ink'}`}>{l}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="alu-mesh border-b border-hair relative overflow-hidden bg-white">
                        <div className="absolute inset-0 grid-lines opacity-40"></div>
                        <div className="absolute top-[-30%] left-[10%] w-[40%] h-[60%] bg-blue-light/10 rounded-full blur-[100px] pointer-events-none blob-anim"></div>
                        <div className="absolute bottom-[-20%] right-[5%] w-[35%] h-[50%] bg-blue/10 rounded-full blur-[100px] pointer-events-none blob-anim" style={{ animationDelay: '2s' }}></div>

                        <div className="max-w-[1240px] mx-auto px-6 lg:px-10 pt-24 pb-20 lg:pt-32 lg:pb-24 relative z-10 flex flex-col lg:flex-row items-start justify-between gap-12">
                            <div className="max-w-2xl">
                                <div className="font-mono text-[12px] tracking-[0.3em] text-blue uppercase mb-6 reveal flex items-center gap-4 font-bold">
                                    <span className="w-8 h-[2px] bg-blue rounded-full"></span>{dict.eyebrow}
                                </div>
                                <h1 className="font-display font-bold text-ink tracking-tightest leading-[1.05] reveal" style={{ fontSize: 'clamp(48px, 6vw, 84px)', animationDelay: '.05s' }}>
                                    {dict.h1a}<br /><span className="bg-gradient-to-r from-blue to-blue-glow bg-clip-text text-transparent">{dict.h1b}</span>
                                </h1>
                                <p className="text-slate2 text-[16px] md:text-[18px] max-w-xl mt-8 leading-relaxed reveal font-medium" style={{ animationDelay: '.12s' }}>{dict.lede}</p>

                                <div className="flex flex-wrap items-center gap-5 mt-10 reveal" style={{ animationDelay: '.18s' }}>
                                    <a href={BASE + '/'} target="_blank" rel="noopener noreferrer" className="sheen-wrap inline-flex items-center gap-2 bg-ink text-white text-[15px] font-bold px-8 py-4 rounded-full hover:bg-blue-deep transition-all shadow-lg hover:shadow-2xl hover:-translate-y-0.5 group">
                                        {dict.openLive}
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="group-hover:translate-x-1 transition-transform"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                    </a>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-px bg-hair rounded-[32px] overflow-hidden hairline reveal stage-shadow shrink-0 w-full lg:w-auto" style={{ animationDelay: '.24s' }}>
                                {STATS.slice(0, 4).map((s, i) => (
                                    <div key={i} className="bg-white/95 px-8 py-8 text-center backdrop-blur-md">
                                        <div className="font-display text-[40px] font-bold text-ink leading-none"><Counter value={s.num} suffix={s.suffix} /></div>
                                        <div className="text-[11px] text-slate2 mt-3 uppercase tracking-widest font-bold">{dict[s.key]}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Content Main Area */}
                    <main className="flex-1 max-w-[1240px] mx-auto w-full px-6 lg:px-10 py-16 lg:py-24 relative z-10">
                        {tab === 'viewport' && <LiveViewport lang={lang} dict={dict} />}
                        {tab === 'summary' && <SummaryTab lang={lang} dict={dict} />}
                        {tab === 'sitemap' && <SitemapTab lang={lang} dict={dict} />}
                        {tab === 'responsive' && <ResponsiveTab lang={lang} dict={dict} />}
                        {tab === 'ci' && <CIBrandTab lang={lang} dict={dict} />}
                        {tab === 'eng' && <EngineeringTab lang={lang} dict={dict} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-hair mt-auto relative z-10">
                        <div className="max-w-[1240px] mx-auto px-6 lg:px-10 py-12 flex flex-col sm:flex-row items-center justify-between gap-6">
