        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0a1628',
                        slate2: '#64748b',

                            100: '#f1f5f9',
                            200: '#e2e8f0',

                            light: '#3d8fdd',
                            deep: '#004a85',
                            glow: '#00c6ff'

                        gold: '#f0c040'
                    },
                    fontFamily: {

                        mono: ['Space Mono', 'monospace'],
